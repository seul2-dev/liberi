<th:block xmlns:th="http://www.thymeleaf.org"
          xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
          layout:decorate="~{layout/layout}">
    <th:block layout:fragment="script">
        <script>
            $(function() {

            });
        </script>
    </th:block>

    <!-- 컨텐츠 영역 -->
    <div layout:fragment="content" class="wrapper">
        <div class="join_box">
            <h2 class="login-title">Join Us</h2>

            <form method="post" class="login-form" id="join_form">
                <div class="info_box">
                    <h3 class="join_title">개인정보</h3>

                    <div class="form-group">
                        <label for="user_id">아이디</label>
                        <div class="input_btn_box">
                            <input type="text" id="user_id" name="userId" placeholder="영문 소문자+숫자 5~15자" />
                            <button type="button" class="btn_sub w15" id="btn_id_chk">중복확인</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="user_pw">비밀번호</label>
                        <input type="password" id="user_pw" name="userPw" placeholder="영문, 숫자, 특수문자 포함" />
                    </div>
                    <div class="form-group">
                        <label for="user_nm">닉네임</label>
                        <input type="text" id="user_nm" name="userNm" placeholder="닉네임을 입력하세요" />
                    </div>

                    <div class="form-group">
                        <label for="user_email">이메일</label>
                        <div class="email_box">
                            <input type="text" id="email_id" name="emailId" placeholder="이메일" />
                            <span class="at">@</span>
                            <input type="text" id="email_domain" name="emailDomain" placeholder="직접입력" />
                            <select id="sel_domain">
                                <option value="">선택</option>
                                <option value="naver.com">naver.com</option>
                                <option value="gmail.com">gmail.com</option>
                                <option value="daum.net">daum.net</option>
                                <option value="direct">직접입력</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="user_phone">전화번호</label>
                        <input type="text" id="user_phone" name="userPhone" placeholder="전화번호를 입력하세요" />
                    </div>
                </div>

                <div class="info_box">
                    <h3 class="join_title">업체정보</h3>

                    <div class="form-group">
                        <label for="str_nm">업체명</label>
                        <input type="text" id="str_nm" name="strNm" placeholder="업체명을 입력하세요" />
                    </div>

                    <div class="form-group">
                        <label for="str_tel">전화번호</label>
                        <input type="text" id="str_tel" name="strTel" placeholder="전화번호를 입력하세요 (- 포함)" />
                    </div>

                    <div class="form-group">
                        <label for="str_addr">주소</label>
                        <div class="addr_box">
                            <div class="input_btn_box">
                                <input type="text" class="w50" id="str_zip" name="strZip" placeholder="우편번호" disabled />
                                <button type="button" class="btn_sub w15" id="btn_addr_srh">주소찾기</button>
                            </div>
                            <div class="input_btn_box">
                                <input type="text" id="str_addr" name="strAddr" placeholder="주소를 입력하세요" />
                                <input type="text" id="str_addr_dtl" name="strAddrDtl" placeholder="상세주소를 입력하세요" />
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="biz_num">사업자번호</label>
                        <div class="input_btn_box">
                            <input type="text" id="biz_num" name="bizNum" placeholder="사업자번호를 입력하세요" />
                            <button type="button" class="btn_sub w15" id="btn_biz_chk">중복확인</button>
                        </div>
                    </div>
                </div>

                <button type="button" class="btn_basic" id="btn_submit">가입하기</button>

            </form>
        </div>
    </div>
</th:block>
